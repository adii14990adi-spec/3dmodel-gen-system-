[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-studio"
version = "1.0.0"
description = "3D Asset Studio processing pipeline, metadata API and Android viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "python-multipart==0.0.22",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
blender = ["bpy==4.2.23", "numpy==1.26.4", "Cython==3.0.11", "requests==2.32.3", "zstandard==0.23.0"]

[project.scripts]
asset-studio = "processing.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["processing*", "backend*"]
