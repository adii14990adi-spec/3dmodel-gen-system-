name: Android Build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths: [ 'android/**' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release APK (requires signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Static Android source checks (no JDK needed)
        run: python3 scripts/check_android_sources.py
      - name: Configure release signing (only when secrets are present)
        if: ${{ inputs.release }}
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::warning::Signing secrets are not configured; building an unsigned release APK."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
      - name: Build debug APK
        id: apk
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/apk-build.log
      - name: Report Gradle build problems
        # Runner logs cannot always be fetched from outside CI; the compiler errors are
        # surfaced as check-run annotations as well.
        if: steps.apk.outcome == 'failure'
        shell: bash
        run: |
          set +e
          { grep -E "^e: |error: |^FAILURE: |> Task .*FAILED|Execution failed|Could not resolve" \
              /tmp/apk-build.log || true; } | head -12 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
      - name: Cross-check the catalog URL compiled into the debug APK
        # The failure this guards against is a placeholder host baked into the APK, so
        # the check inspects the shipped DEX rather than only the source. The generic
        # "example.invalid" literal does appear once on purpose: Catalog.kt keeps the
        # blocklist that rejects placeholder hosts at runtime.
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile
          sys.path.insert(0, ".")
          from scripts.build_pages_site import pages_base_url

          apk = next(pathlib.Path("android/app/build/outputs/apk/debug").glob("*.apk"))
          configured = ""
          for line in pathlib.Path("android/gradle.properties").read_text().splitlines():
              if line.startswith("assetStudio.pagesBaseUrl="):
                  configured = line.split("=", 1)[1].strip()
          expected = pages_base_url(allow_http=False)
          with zipfile.ZipFile(apk) as archive:
              dex_names = sorted(n for n in archive.namelist()
                                 if n.startswith("classes") and n.endswith(".dex"))
              blob = b"".join(archive.read(name) for name in dex_names)
          pages_hits = blob.count(configured.encode())
          bad_host_hits = blob.count(b"asset-studio.example.invalid")
          blocklist_hits = blob.count(b"example.invalid")
          print(f"apk                    {apk.name} ({apk.stat().st_size} bytes)")
          print(f"dex entries            {len(dex_names)}: {', '.join(dex_names)}")
          print(f"gradle default         {configured}")
          print(f"pages base url         {expected}")
          print(f"catalog url in dex     {pages_hits} occurrence(s)")
          print(f"bad host in dex        {bad_host_hits} occurrence(s)")
          print(f"blocklist literal      {blocklist_hits} occurrence(s) (expected 1, runtime guard)")
          problems = []
          if not configured:
              problems.append("android/gradle.properties does not define assetStudio.pagesBaseUrl")
          elif configured != expected:
              problems.append(f"gradle.properties has {configured}, Pages publishes {expected}")
          if pages_hits < 1:
              problems.append("the APK does not contain the Pages catalog URL")
          if bad_host_hits:
              problems.append("the APK still resolves the placeholder host asset-studio.example.invalid")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              raise SystemExit(1)
          print(f"::notice title=APK catalog URL::BuildConfig.CATALOG_BASE_URL = {configured}, "
                f"shipped in the DEX, zero placeholder hosts")
          PY
      - name: Verify Filament 1.75.1 artifacts and Animator API
        # Proves the versions we compile against are the resolved ones, and that the gltfio
        # Animator methods the renderer calls actually exist in the 1.75.1 AAR. It runs after
        # assembleDebug because only a real compile downloads the AARs into the cache.
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :renderer:dependencies --configuration debugCompileClasspath --no-daemon > /tmp/filament-deps.txt
          grep -E "filament-(android|utils-android)|gltfio-android" /tmp/filament-deps.txt | sort -u
          grep -q "filament-android:1.75.1" /tmp/filament-deps.txt
          grep -q "gltfio-android:1.75.1" /tmp/filament-deps.txt
          grep -q "filament-utils-android:1.75.1" /tmp/filament-deps.txt
          AAR=$(find "$HOME/.gradle/caches/modules-2" -name "gltfio-android-1.75.1.aar" | head -1)
          test -n "$AAR" || { echo "::error::gltfio-android-1.75.1.aar was not downloaded"; exit 1; }
          rm -rf /tmp/gltfio && mkdir -p /tmp/gltfio
          unzip -q -o "$AAR" 'classes.jar' -d /tmp/gltfio
          javap -classpath /tmp/gltfio/classes.jar com.google.android.filament.gltfio.Animator > /tmp/animator-api.txt
          cat /tmp/animator-api.txt
          for sym in applyAnimation updateBoneMatrices getAnimationCount getAnimationDuration getAnimationName; do
            grep -q "$sym" /tmp/animator-api.txt || { echo "::error::Animator#$sym missing from gltfio-android 1.75.1"; exit 1; }
          done
          echo "::notice title=Filament 1.75.1::resolved AAR verified; Animator exposes applyAnimation, updateBoneMatrices, getAnimationCount, getAnimationDuration, getAnimationName"
      - name: Playback transport unit tests (:animation)
        # JVM tests for play/pause/stop/loop/seek and the playback validator.
        id: animation_tests
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :animation:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/animation-tests.log
      - name: Kotlin unit tests (all Android modules)
        id: module_tests
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/module-tests.log
      - name: Live catalog smoke test against the deployed Pages site
        # Runs the real client code (CatalogClient + AssetDownloader) against the live
        # site the APK ships in BuildConfig.CATALOG_BASE_URL. Skipped with a warning when
        # the site is not reachable, so a Pages outage cannot block an APK build.
        env:
          ASSET_STUDIO_LIVE_BASE_URL: https://adii14990adi-spec.github.io/3dmodel-gen-system-
        run: |
          set -uo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$ASSET_STUDIO_LIVE_BASE_URL/catalog/index.json" || true)
          echo "GET $ASSET_STUDIO_LIVE_BASE_URL/catalog/index.json -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning title=Live catalog unavailable::The deployed catalog returned \
            HTTP $code, so the live smoke test is skipped in this run."
            exit 0
          fi
          ./gradlew :asset-library:testDebugUnitTest --tests '*LiveCatalogSmokeTest*' \
            --no-daemon --stacktrace 2>&1 | tee /tmp/live-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error: |^FAILURE: |> Task .*FAILED|Execution failed" /tmp/live-smoke.log \
              | head -20 | while read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          total = failures = 0
          for report in glob.glob("android/asset-library/build/test-results/**/TEST-*LiveCatalogSmokeTest.xml",
                                  recursive=True):
              root = ET.parse(report).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
              for case in root.iter("testcase"):
                  status = "skipped" if case.find("skipped") is not None else "passed"
                  print(f"live {status}: {case.get('name')}")
          print(f"live smoke: {total} test(s), {failures} failure(s)")
          if total == 0:
              print("::error::the live smoke test produced no results")
              raise SystemExit(1)
          raise SystemExit(1 if failures else 0)
          PY
      - name: Report JVM unit test results
        # Runner logs are not always fetchable from outside CI, so the pass/fail verdict and the
        # per-module counts are surfaced as check-run annotations too.
        if: always()
        shell: bash
        run: |
          # the runner shell is `bash -e`, so the log greps below must not abort the step
          set -uo pipefail
          set +e
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          rows = []
          for f in sorted(glob.glob("android/*/build/test-results/testDebugUnitTest/*.xml")):
              module = f.split("/")[1]
              root = ET.parse(f).getroot()
              t, fa, er, sk = (int(root.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; failures += fa; errors += er; skipped += sk
              rows.append(f"{module}: {t} tests, {fa} failures, {er} errors, {sk} skipped")
              for case in root.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      msg = " / ".join((bad.get("message") or "").strip().splitlines()[:3]).replace("%", "%25")
                      print(f"::error title={module} {case.get('classname')}.{case.get('name')}::{msg[:900]}")
          summary = f"{total} run, {failures} failures, {errors} errors, {skipped} skipped"
          print(f"JVM unit tests: {summary}")
          for row in rows:
              print(f"  {row}")
          print(f"::notice title=Kotlin JVM unit tests::{summary} | " + " | ".join(rows))
          if total == 0:
              print("::error::No JVM unit test results were produced")
              raise SystemExit(1)
          raise SystemExit(1 if (failures or errors) else 0)
          PY
          status=$?
          for log in /tmp/animation-tests.log /tmp/module-tests.log; do
            [ -f "$log" ] || continue
            { grep -E "^(e: |> Task .*FAILED)|FAILED$|error: " "$log" || true; } | head -10 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          done
          exit $status
      - name: Build release APK
        if: ${{ inputs.release }}
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: asset-studio-apk-${{ github.run_id }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
      - name: Build summary
        if: always()
        run: |
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "JDK 17 · Gradle 8.9 · AGP 8.7.3 · Kotlin 2.0.21 · Filament 1.75.1" >> "$GITHUB_STEP_SUMMARY"
          echo "Playback: :animation:testDebugUnitTest covers play/pause/stop/seek/loop/speed" >> "$GITHUB_STEP_SUMMARY"
