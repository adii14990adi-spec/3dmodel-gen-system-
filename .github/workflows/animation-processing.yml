name: Animation Processing

on:
  push:
    paths:
      - 'assets/animation/**'
      - 'assets/models/characters/**'
      - 'processing/**'
      - 'config/bone_mappings/**'
  workflow_dispatch:
    inputs:
      all:
        description: 'Reprocess every animation'
        type: boolean
        default: false
      paths:
        description: 'Source paths, one per line (optional; validated by scripts/dispatch_paths.py)'
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: animation-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      BLENDER_DISABLE_AUTOEXEC: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix tools/gltf-validator || npm install --prefix tools/gltf-validator
      - name: Install headless Blender 4.2 LTS
        run: |
          curl -fsSL https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /opt/blender && tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          echo "/opt/blender" >> "$GITHUB_PATH"
      - name: Ensure model manifests exist
        run: python scripts/run_pipeline.py process-models --all
      - name: Inventory the animation library
        # Scans assets/animation (including the read-only Upload archive), detects
        # the real format from magic bytes, measures motion, checks skeletons and
        # writes reports/animations/library/inventory.json + skeleton-compatibility.json.
        run: python -m processing.cli inventory
      - name: Organize uploads into the category tree
        # Copy-only: originals are hashed before and after, nothing is moved,
        # overwritten or deleted. Re-runs are idempotent (identical copies are
        # detected and reported as already_organized).
        run: python -m processing.cli organize --apply
      - name: Library summary
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("reports/animations/library/inventory.json").read_text())
          totals = report["totals"]
          print(f"{totals['files']} file(s): {totals['supported']} supported, "
                f"{totals['unsupported']} unsupported, {totals['corrupted']} corrupted, "
                f"{totals['duplicate_groups']} duplicate group(s)")
          for category, count in sorted(totals["by_category"].items()):
              print(f"  {category}: {count}")
          if totals["corrupted"]:
              raise SystemExit("corrupted sources present - see the inventory report")
          PY
      - name: Resolve changed animation sources
        id: changes
        shell: bash
        env:
          # Untrusted dispatch input travels through the environment: it is
          # never interpolated into shell code and never word-split by bash.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALL: ${{ inputs.all }}
          INPUT_PATHS: ${{ inputs.paths }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # NUL-separated tokens keep paths with spaces, quotes or unicode intact
          # and avoid interpolating file names into shell code.
          LIST="${RUNNER_TEMP:-/tmp}/animation-changes.bin"
          : > "$LIST"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_ALL" = "true" ]; then
            printf -- '--all\0' > "$LIST"
          elif [ -n "$INPUT_PATHS" ]; then
            # The input is data, not code: write it byte-for-byte to a file and
            # let the parser validate format, prefix, extension and containment.
            PATHS_FILE="${RUNNER_TEMP:-/tmp}/animation-changes.bin.input"
            printf '%s' "$INPUT_PATHS" > "$PATHS_FILE"
            python scripts/dispatch_paths.py --kind animation --paths-file "$PATHS_FILE" --null > "$LIST"
          else
            python scripts/changed_files.py --base "$BASE_SHA" --head "$HEAD_SHA" --kind animation --null > "$LIST"
          fi
          count=$(tr -cd '\0' < "$LIST" | wc -c | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Resolved $count source token(s)"

      - name: Process animations
        if: steps.changes.outputs.count != '0'
        env:
          CHANGE_LIST: ${{ steps.changes.outputs.list }}
        run: xargs -0 -r python scripts/run_pipeline.py process-animations < "$CHANGE_LIST"

      - name: Validate playback data for idle/walk/run/jump/attack/death
        # Proves the exported GLBs really contain clips on skeleton joints with
        # non-zero duration. Pixel-level playback still needs a device.
        run: python scripts/validate_playback_assets.py --strict

      - name: Verify original uploads are untouched
        # The archive must stay byte-identical: every manifest records the source
        # SHA-256, so recompute it and fail if any original changed.
        run: python scripts/verify_upload_integrity.py --root assets/animation/Upload
      - name: Processing summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          manifests = sorted(pathlib.Path("manifests/animations").glob("*.json")) \
              if pathlib.Path("manifests/animations").is_dir() else []
          counts = {}
          retargets = {}
          for path in manifests:
              data = json.loads(path.read_text())
              counts[data["validation"]["status"]] = counts.get(data["validation"]["status"], 0) + 1
              retargets[data.get("retarget_status", "")] = retargets.get(data.get("retarget_status", ""), 0) + 1
          print(f"{len(manifests)} animation manifest(s): {counts}")
          print(f"retarget: {retargets}")
          print(f"runtime GLBs: {len(list(pathlib.Path('processed/animations').rglob('*.glb')))}")
          PY

      - name: Build index
        run: python scripts/run_pipeline.py build-index
      - name: Upload reports, manifests and runtime GLBs
        uses: actions/upload-artifact@v4
        with:
          name: animation-publication-${{ github.run_id }}
          path: |
            manifests/
            reports/
            processed/animations/
          retention-days: 14
      - name: Publish to persistent object storage
        env:
          ASSET_STUDIO_S3_BUCKET: ${{ secrets.ASSET_STUDIO_S3_BUCKET }}
          ASSET_STUDIO_S3_ENDPOINT: ${{ secrets.ASSET_STUDIO_S3_ENDPOINT }}
          ASSET_STUDIO_S3_ACCESS_KEY: ${{ secrets.ASSET_STUDIO_S3_ACCESS_KEY }}
          ASSET_STUDIO_S3_SECRET_KEY: ${{ secrets.ASSET_STUDIO_S3_SECRET_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/publish_storage.py --prefix "staging/$RUN_ID" --then-promote
