name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci --prefix tools/gltf-validator || npm install --prefix tools/gltf-validator
      - name: Build publication
        run: |
          python scripts/generate_sample_assets.py
          python -m processing.cli process-models --all
          python -m processing.cli process-animations --all
          python -m processing.cli build-index
      - name: Sign Android release (only with configured secrets)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > keystore.properties
            ./gradlew :app:assembleRelease --no-daemon
          else
            echo "::warning::No signing secrets; no signed APK will be attached."
            ./gradlew :app:assembleDebug --no-daemon
          fi
      - name: Create release with manifests and APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p /tmp/release
          tar -czf /tmp/release/manifests.tar.gz manifests reports
          gh release create "$TAG" --title "3D Asset Studio $TAG" \
            --notes "Automated publication. See docs/ for setup and honest limitations." \
            /tmp/release/manifests.tar.gz \
            $(find android/app/build/outputs/apk -name '*.apk' -print) || \
          gh release upload "$TAG" /tmp/release/manifests.tar.gz --clobber
