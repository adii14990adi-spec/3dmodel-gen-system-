name: Validation

on:
  push:
    paths-ignore:
      - 'assets/**/*.glb'
      - 'assets/**/*.bvh'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/unit/test_workflows.py diffs real commits, so the clone cannot be shallow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci --prefix tools/gltf-validator || npm install --prefix tools/gltf-validator
      - name: Python syntax check
        run: python -m compileall -q processing backend scripts
      - name: Generate verification dataset
        run: python scripts/generate_sample_assets.py
      - name: Run model and animation pipelines
        run: |
          python -m processing.cli process-models --all
          python -m processing.cli process-animations --all
          python -m processing.cli build-index
      - name: Official Khronos glTF Validator
        run: python -m processing.cli validate
      - name: Python test suite
        # The verdict and the failing test ids are also emitted as check-run annotations,
        # so a red run is diagnosable without downloading the (large) runner logs.
        shell: bash
        run: |
          set -o pipefail
          set +e
          status=0
          pytest -q 2>&1 | tee /tmp/pytest.log || status=$?
          summary=$(grep -Eo "[0-9]+ (passed|failed|error)[^,]*" /tmp/pytest.log | tail -1)
          echo "::notice title=Python test suite::${summary:-no summary line}"
          if [ "$status" -ne 0 ]; then
            { grep -E "^(FAILED|ERROR) " /tmp/pytest.log || true; } | head -8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            { grep -E "^E  " /tmp/pytest.log || true; } | head -4 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
      - name: Android source structure checks
        run: python scripts/check_android_sources.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
