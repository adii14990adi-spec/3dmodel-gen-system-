name: Asset Processing

on:
  push:
    paths:
      - 'assets/models/**'
      - 'processing/**'
      - 'config/**'
      - 'tools/gltf-validator/**'
  workflow_dispatch:
    inputs:
      all:
        description: 'Reprocess every model'
        type: boolean
        default: false
      paths:
        description: 'Source paths, one per line (optional; validated by scripts/dispatch_paths.py)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: asset-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      BLENDER_DISABLE_AUTOEXEC: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix tools/gltf-validator || npm install --prefix tools/gltf-validator

      - name: Install headless Blender 4.2 LTS
        run: |
          BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          curl -fsSL "$BLENDER_URL" -o /tmp/blender.tar.xz
          mkdir -p /opt/blender
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          echo "/opt/blender" >> "$GITHUB_PATH"
          /opt/blender/blender --version

      - name: Resolve changed model sources
        id: changes
        shell: bash
        env:
          # Untrusted dispatch input travels through the environment: it is
          # never interpolated into shell code and never word-split by bash.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALL: ${{ inputs.all }}
          INPUT_PATHS: ${{ inputs.paths }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # NUL-separated tokens keep paths with spaces, quotes or unicode intact
          # and avoid interpolating file names into shell code.
          LIST="${RUNNER_TEMP:-/tmp}/model-changes.bin"
          : > "$LIST"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_ALL" = "true" ]; then
            printf -- '--all\0' > "$LIST"
          elif [ -n "$INPUT_PATHS" ]; then
            # The input is data, not code: write it byte-for-byte to a file and
            # let the parser validate format, prefix, extension and containment.
            PATHS_FILE="${RUNNER_TEMP:-/tmp}/model-changes.bin.input"
            printf '%s' "$INPUT_PATHS" > "$PATHS_FILE"
            python scripts/dispatch_paths.py --kind model --paths-file "$PATHS_FILE" --null > "$LIST"
          else
            python scripts/changed_files.py --base "$BASE_SHA" --head "$HEAD_SHA" --kind model --null > "$LIST"
          fi
          count=$(tr -cd '\0' < "$LIST" | wc -c | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Resolved $count source token(s)"

      - name: Process models
        if: steps.changes.outputs.count != '0'
        env:
          CHANGE_LIST: ${{ steps.changes.outputs.list }}
        run: xargs -0 -r python scripts/run_pipeline.py process-models < "$CHANGE_LIST"

      - name: Build index and sync metadata
        run: python scripts/run_pipeline.py build-index

      - name: Upload reports and manifests
        uses: actions/upload-artifact@v4
        with:
          name: model-publication-${{ github.run_id }}
          path: |
            manifests/
            reports/
            processed/models/**/*.metadata.json
          retention-days: 14

      - name: Publish processed GLBs to persistent object storage
        env:
          ASSET_STUDIO_S3_BUCKET: ${{ secrets.ASSET_STUDIO_S3_BUCKET }}
          ASSET_STUDIO_S3_ENDPOINT: ${{ secrets.ASSET_STUDIO_S3_ENDPOINT }}
          ASSET_STUDIO_S3_ACCESS_KEY: ${{ secrets.ASSET_STUDIO_S3_ACCESS_KEY }}
          ASSET_STUDIO_S3_SECRET_KEY: ${{ secrets.ASSET_STUDIO_S3_SECRET_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Atomic publication: upload to a staging prefix, then copy into place.
          python scripts/publish_storage.py --prefix "staging/$RUN_ID" --then-promote

      - name: Summary
        if: always()
        env:
          CHANGE_COUNT: ${{ steps.changes.outputs.count }}
          CHANGE_LIST: ${{ steps.changes.outputs.list }}
        run: |
          echo "### Model processing" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed source tokens: $CHANGE_COUNT (list: $CHANGE_LIST)" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports and manifests are attached as CI artifacts." >> "$GITHUB_STEP_SUMMARY"
