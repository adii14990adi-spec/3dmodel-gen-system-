name: Asset Processing

on:
  push:
    paths:
      - 'assets/models/**'
      - 'processing/**'
      - 'config/**'
      - 'tools/gltf-validator/**'
  workflow_dispatch:
    inputs:
      all:
        description: 'Reprocess every model'
        type: boolean
        default: false
      paths:
        description: 'Space-separated source paths (optional)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: asset-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      BLENDER_DISABLE_AUTOEXEC: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix tools/gltf-validator || npm install --prefix tools/gltf-validator

      - name: Install headless Blender 4.2 LTS
        run: |
          BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          curl -fsSL "$BLENDER_URL" -o /tmp/blender.tar.xz
          mkdir -p /opt/blender
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          echo "/opt/blender" >> "$GITHUB_PATH"
          /opt/blender/blender --version

      - name: Resolve changed model sources
        shell: bash
        run: |
          set -euo pipefail
          # NUL-separated tokens keep paths with spaces, quotes or unicode intact
          # and avoid interpolating file names into shell code.
          LIST="${RUNNER_TEMP:-/tmp}/model-changes.bin"
          : > "$LIST"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            printf -- '--all\0' > "$LIST"
          elif [ -n "${{ inputs.paths }}" ]; then
            # shellcheck disable=SC2086 - the input is an intentionally space-separated list
            for p in ${{ inputs.paths }}; do printf '%s\0' "$p"; done > "$LIST"
          else
            python scripts/changed_files.py --base "${{ github.event.before }}" --head "${{ github.sha }}" --kind model --null > "$LIST"
          fi
          count=$(tr -cd '\0' < "$LIST" | wc -c | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Resolved $count source token(s)"

      - name: Process models
        if: steps.changes.outputs.count != '0'
        run: xargs -0 -r python scripts/run_pipeline.py process-models < "${{ steps.changes.outputs.list }}"

      - name: Build index and sync metadata
        run: python scripts/run_pipeline.py build-index

      - name: Upload reports and manifests
        uses: actions/upload-artifact@v4
        with:
          name: model-publication-${{ github.run_id }}
          path: |
            manifests/
            reports/
            processed/models/**/*.metadata.json
          retention-days: 14

      - name: Publish processed GLBs to persistent object storage
        env:
          ASSET_STUDIO_S3_BUCKET: ${{ secrets.ASSET_STUDIO_S3_BUCKET }}
          ASSET_STUDIO_S3_ENDPOINT: ${{ secrets.ASSET_STUDIO_S3_ENDPOINT }}
          ASSET_STUDIO_S3_ACCESS_KEY: ${{ secrets.ASSET_STUDIO_S3_ACCESS_KEY }}
          ASSET_STUDIO_S3_SECRET_KEY: ${{ secrets.ASSET_STUDIO_S3_SECRET_KEY }}
        run: |
          # Atomic publication: upload to a staging prefix, then copy into place.
          python scripts/publish_storage.py --prefix "staging/${{ github.run_id }}" --then-promote

      - name: Summary
        if: always()
        run: |
          echo "### Model processing" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed source tokens: ${{ steps.changes.outputs.count }} (list: ${{ steps.changes.outputs.list }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports and manifests are attached as CI artifacts." >> "$GITHUB_STEP_SUMMARY"
